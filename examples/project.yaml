# Settings for one repository.
repo: my-user/my-project
base_branch: main
# fork: my-bot/my-project   # push to a fork and open pull requests upstream
branch_prefix: amaru/

intake:
  labels: [amaru]          # issues with any of these labels are eligible
  assignee: amaru-bot      # and/or issues assigned to the bot
  skip_labels: [amaru:hold, needs-human]
  priority_labels: [priority:high, priority:medium]

agent: claude
step_timeout: 45m

checks:
  - name: check
    run: make check
    timeout: 30m
max_fix_rounds: 3

review:
  self: off                # off | same_agent | other_agent
  respond: true            # act on reviews received on the pull request
  reviewers: [my-user]     # only these logins' feedback reaches the agent
  max_rounds: 5
  fix_ci: true

workspace:
  keep_blocked: 7d         # e.g. 0, 7d or forever
