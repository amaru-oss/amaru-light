[package]
name = "mini-amaru"
version = "0.1.0"
edition = "2024"
description = "Local engineering agent runtime and delivery loop"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.32.0", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1"
tiny_http = "0.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"

# Lint levels copied from the workspace lints of wanaku-ai/wanaku (156f7697).
# `from_iter_instead_of_collect` is left out: Rust 1.98 removed it.
[lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[lints.clippy]
# Safety: prevent panicking in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Correctness
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

# Clarity
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
if_not_else = "warn"
macro_use_imports = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"

# Complexity
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

# Async
large_futures = "warn"
large_stack_frames = "warn"

# Disallowed methods (configured in clippy.toml)
disallowed_methods = "deny"
