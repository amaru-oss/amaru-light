[package]
name = "mini-amaru"
version = "0.1.0"
edition = "2024"
description = "Local engineering agent runtime and delivery loop"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
