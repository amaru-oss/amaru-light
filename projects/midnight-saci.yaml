project:
  name: midnight-saci
  repository: orpiske/midnight-saci/
  root: ../repos/midnight-saci

git:
  base_branch: main
  branch_prefix: quick-fix          # only for items without an issue; issues use <prefix>/<n>-<slug>
  branch_prefixes:               # label -> prefix (default: feat); see Amaru's delivery.md §5
    bug: ci-issue
    documentation: docs
    migration-adr: docs
    spike: spike

execution:
  max_parallel_agents: 1
  require_tests: true
  require_review: false
  check_command: make check      # runs in the worktree before opening the PR; failure = no PR
  check_timeout_seconds: 1800

# --- delivery loop (cargo run -- loop ...) ---
loop:
  max_iterations: 20             # work items per loop run
  max_tasks_per_item: 8
  skip_labels: [owner-task, awaiting-owner-approval, milestone-exit]   # human gates: never executed
  create_integration_branch: true   # creates feat/<parent>-<slug> from the base if the sub-issue has none
  worktrees_dir: data/worktrees
  on_blocked: stop               # stop | brain (the brain chooses to skip the item)
  on_waiting: stop               # stop | continue (continue even with a PR awaiting merge)
  brain_route: planning

publish:
  mode: auto                     # auto | manual (manual: stops at WAITING_PR; the UI creates the PR)

review:
  enabled: true                  # independent reviewer agent comments on the PR
  max_rounds: 1                  # fix rounds before BLOCKED

merge:
  mode: integration_only         # manual | integration_only | always
  method: rebase

models:
  allowed:
    - claude-haiku
    - claude-sonnet
    - codex-default
    - codex-classic
    - ollama-planner

skills:
  directory: ../skills
  defaults:
    - engineering/implementation
    - conventions/git-workflow

github:
  cli: gh
  # If null, the runtime extracts "Milestone 5" from the prompt.
  milestone: null
  # Configure a number OR a dedicated label for the exit issue.
  exit_issue_number: null
  exit_issue_label: null
  publish_report: true
