<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amaru Light</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">
      <img src="/logo.svg" alt="" width="32" height="32">
      <span class="wordmark">Amaru <em>Light</em></span>
    </a>
    <nav>
      <a href="#/" data-nav="tickets">Tickets</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/agents" data-nav="agents">Agents</a>
    </nav>
    <div class="bar-end">
      <span id="pulse" class="pulse" title="Connecting…"></span>
      <button id="theme" class="ghost" type="button" title="Switch light and dark" aria-label="Switch light and dark"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
</body>
</html>
