# CLI providers receive the prompt via stdin. Adjust command/model to match
# the installed CLI version. Placeholders: {model}.
providers:
  claude:
    enabled: true
    type: cli
    # acceptEdits: without it, claude -p cannot edit files in non-interactive mode.
    command: ["claude", "-p", "--output-format", "text", "--model", "{model}", "--permission-mode", "acceptEdits"]
    models:
      - haiku
      - sonnet
    default_model: sonnet
    timeout_seconds: 3600

  codex:
    enabled: true
    type: cli
    # CODEX_HOME is inherited from the Mini-Amaru process environment.
    command: ["codex", "exec", "--approve-for-me", "--model", "{model}", "-"]
    models:
      - gpt-6.2-sol
      - gpt-6.1-sol
      - gpt-5.6-sol
    default_model: gpt-6.1-sol
    timeout_seconds: 3600

  opencode:
    enabled: false
    type: cli
    # Adjust to match the CLI and provider configured in your environment.
    command: ["opencode", "run", "--model", "{model}"]
    models:
      - anthropic/claude-sonnet
    default_model: anthropic/claude-sonnet
    timeout_seconds: 3600

  ollama:
    enabled: false
    type: ollama
    endpoint: http://localhost:11434
    models:
      - qwen3
      - glm-4.7-flash
    default_model: qwen3
    timeout_seconds: 600
